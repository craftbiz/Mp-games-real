name: Extract and Deploy ZIP to Root

on:
  push:
    paths:
      - 'mpgames.zip'
  workflow_dispatch:

jobs:
  extract-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if mpgames.zip exists
        run: |
          if [ ! -f "mpgames.zip" ]; then
            echo "Error: mpgames.zip not found in the root of the repository!"
            exit 1
          fi

      - name: Extract test.zip to temporary directory
        run: |
          mkdir temp_extracted
          unzip test.zip -d temp_extracted/

      - name: Move extracted files to root and clean up
        run: |
          # Remove the original zip so it doesn't get re-committed or cause loops
          rm test.zip
          
          # Move everything from temp folder to root
          # Using dotglob to ensure hidden files (like .gitignore) are moved too
          shopt -s dotglob
          mv temp_extracted/* ./
          rm -rf temp_extracted

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          # Check if there are any changes to commit to avoid workflow errors
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit."
          else
            git commit -m "Automated unzip and deploy to root"
            git push origin HEAD:${{ github.ref }}
          fi
